<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="./asets/css/style.css">
    <script src="./asets/js/script.js" defer></script>

    <title>La Fiesta de las Flores</title>
</head>

<body>

    <header class="position-sticky top-0 z-3">
        <nav class="navbar justify-content-between">
            <div class="mx-auto">
                <a class="navbar-brand fw-light mx-auto" href="./index.html">
                    LA FIESTA DE LAS FLORES
                </a>
            </div>

            <div class="carrito-div me-3">
                <button class="carrito border border-0 position-relative" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
                    aria-controls="offcanvasRight">
                    <img src="./asets/icons/icons8-bag-32.png" class="icono-carrito" alt="">
                    <span id="contador-carrito"
                        class="bolita-carrito position-absolute bottom-0 end-0 badge rounded-pill bg-danger">
                        0
                    </span>
                </button>

                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight"
                    aria-labelledby="offcanvasRightLabel">

                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasRightLabel">Mi Carrito</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                            aria-label="Close"></button>
                    </div>

                    <div class="offcanvas-body d-flex flex-column">

                        <div id="lista-carrito" class="flex-grow-1 overflow-auto"></div>

                        <hr>

                        <div class="mt-auto">
                            <div class="d-flex justify-content-between fw-bold">
                                <span>Subtotal:</span>
                                <span id="total-carrito">ARS $ 0,00</span>
                            </div>

                            <hr>

                            <button class="btn btn-success w-100 boton-finalizar-compra">
                                Finalizar Compra
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main>
        <div class="position-relative p-4 w-100 pt-0">
            <img src="./asets/images/dandelion-1.jpg" alt="La Fiesta de las Flores"
                class="imagen-hero-section object-fit-cover w-100 opacity-50">

            <div
                class="contenido-hero position-absolute bottom-0 start-50 translate-middle d-flex flex-column justify-content-center pb-4 column-gap-5 align-items-center">
                <h1 class="logo-hero d-flex text-center">PRIMAVERA</h1>
                <button class="btn btn-primary boton-hero-cta border border-0">ENTRÁ A LA COMUNIDAD</button>
            </div>
        </div>
    </main>

    <div class="contedenor-etiqueta p-4 m-0">
        <h5 class="etiqueta-section">Novedades</h5>
    </div>

    <section class="mt-0">
        <div class="w-100 p-4">
            <div class="contenedor-grilla container-fluid text-start">
                <div id="contenedor-productos-nueva-coleccion" class="row">
                    <!-- Rellenado por script.js -->
                </div>
            </div>
        </div>
    </section>

    <article class="contenedor-membresia p-4 d-flex flex-column position-relative">
        <div class="section-membresia w-100 h-100">
            <img src="./asets/images/dandelion-1.jpg" alt=""
                class="imagen-section-membresia object-fit-cover w-100 opacity-50 h-100">

            <p class="texto-membresia position-absolute top-50 start-50 translate-middle">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed illum exercitationem.
            </p>
        </div>
    </article>

    <div class="contedenor-etiqueta p-4 m-0">
        <h5 class="etiqueta-section">Kids</h5>
    </div>

    <section class="mt-0">
        <div class="w-100 p-4">
            <div class="contenedor-grilla container-fluid text-start">
                <div id="contenedor-productos-kids" class="row">
                    <!-- Rellenado por script.js -->
                </div>
            </div>
        </div>
    </section>

    <footer class="foot w-100 d-flex justify-content-center align-items-center">
        <p class="mt-auto mb-auto">
            <a href="./index.html" class="text-decoration-none">La Fiesta de las Flores</a>.
            Todos los derechos reservados
        </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
